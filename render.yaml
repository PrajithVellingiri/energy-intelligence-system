services:
  - type: web
    name: energy-intelligence-backend
    runtime: python
    buildCommand: cd energy-backend && pip install -r requirements.txt
    startCommand: cd energy-backend && uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: SECRET_KEY
        generateValue: true
      - key: FRONTEND_URL
        sync: false
